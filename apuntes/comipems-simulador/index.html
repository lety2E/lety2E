<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador COMIPEMS · Ingreso a bachillerato — lety2E</title>
  <meta name="description" content="Simulador del examen único de ingreso a bachillerato (COMIPEMS / ECOEMS). Practica por bloques y repasa tus errores.">
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml">
  <link rel="icon" href="../../favicon.ico">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <style>
    :root {
      --M: #FF00AA;
      --T: #00DEC8;
      --P: #4A0080;
      --dark: #1A0828;
      --bg:      #FBF2EF;
      --bg-card: #FFFFFF;
      --border-s: #EFD8D0;
      --txt:     #1e0f2e;
      --txt-2:   #5a3f78;
      --ok: #1FBA77;
      --bad: #E03B6A;
    }
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;600;700&family=Playfair+Display:wght@900&display=swap');

    * { box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      background: var(--bg);
      color: var(--txt);
      min-height: 100vh;
      margin: 0;
    }
    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 2rem 1.25rem 4rem;
    }
    .page-h1 {
      font-family: 'Playfair Display', serif;
      font-weight: 900;
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      color: var(--P);
      margin: 0 0 .25rem;
      line-height: 1.1;
    }
    .page-sub {
      color: var(--txt-2);
      margin: 0 0 2rem;
      font-size: .95rem;
    }

    /* Tabs */
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: .35rem;
      border-bottom: 2px solid var(--border-s);
      margin-bottom: 1.5rem;
    }
    .tab-btn {
      background: none;
      border: none;
      padding: .8rem .9rem;
      font: inherit;
      font-weight: 600;
      color: var(--txt-2);
      cursor: pointer;
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
      white-space: nowrap;
      transition: color .15s, border-color .15s;
      font-size: .95rem;
    }
    .tab-btn:hover { color: var(--dark); }
    .tab-btn.active {
      color: var(--tab-accent, var(--P));
      border-bottom-color: var(--tab-accent, var(--P));
    }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    .panel-block {
      background: var(--bg-card);
      border: 1px solid var(--border-s);
      border-left: 6px solid var(--accent, var(--T));
      border-radius: 14px;
      padding: 1.8rem 1.5rem;
      margin-bottom: 1.5rem;
    }
    .panel-block h2 {
      font-family: 'Playfair Display', serif;
      font-weight: 900;
      font-size: 1.6rem;
      margin: 0 0 .3rem;
      color: var(--dark);
      line-height: 1.1;
    }
    .panel-block .panel-subtitle {
      margin: 0 0 .35rem;
      color: var(--accent, var(--T));
      font-weight: 600;
      font-size: .95rem;
    }
    .panel-block .panel-count {
      margin: 0 0 1.3rem;
      color: var(--txt-2);
      font-size: .9rem;
    }
    .panel-block .composition {
      list-style: none;
      padding: 0;
      margin: 0 0 1.3rem;
      display: flex;
      flex-wrap: wrap;
      gap: .4rem;
    }
    .panel-block .composition li {
      background: var(--bg);
      border: 1px solid var(--border-s);
      padding: .3rem .7rem;
      border-radius: 16px;
      font-size: .82rem;
      color: var(--txt-2);
    }
    .panel-block .composition li strong { color: var(--dark); }
    .btn-start {
      background: var(--accent, var(--T));
      color: var(--dark);
      border: none;
      padding: .9rem 1.5rem;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      font-size: 1rem;
      transition: filter .15s;
    }
    .btn-start:hover { filter: brightness(0.9); }

    .errors-card {
      background: #FFE9F2;
      border: 1px dashed var(--M);
      border-radius: 14px;
      padding: 1rem 1.25rem;
      margin-bottom: 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }
    .errors-card-text strong { color: var(--M); }
    .errors-card-text p { margin: .2rem 0 0; font-size: .85rem; color: var(--txt-2); }
    .btn-errors {
      background: var(--M);
      color: white;
      border: none;
      padding: .6rem 1rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      flex-shrink: 0;
    }
    .btn-errors:hover { background: var(--P); }
    .btn-errors:disabled { background: #bbb; cursor: not-allowed; }

    .history-card {
      background: var(--bg-card);
      border: 1px solid var(--border-s);
      border-radius: 14px;
      padding: 1rem 1.25rem;
      margin-bottom: 1.5rem;
    }
    .history-card h3 { margin: 0 0 .6rem; font-size: 1rem; color: var(--P); font-weight: 600; }
    .history-list { list-style: none; padding: 0; margin: 0; font-size: .85rem; color: var(--txt-2); }
    .history-list li { padding: .25rem 0; border-bottom: 1px solid var(--border-s); display: flex; justify-content: space-between; }
    .history-list li:last-child { border-bottom: none; }

    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
      gap: .75rem;
      flex-wrap: wrap;
    }
    .quiz-progress { font-size: .85rem; color: var(--txt-2); }
    .quiz-progress strong { color: var(--dark); }
    .subject-tag {
      display: inline-block;
      background: var(--P);
      color: white;
      padding: .25rem .6rem;
      border-radius: 6px;
      font-size: .75rem;
      letter-spacing: .03em;
      text-transform: uppercase;
      font-weight: 600;
    }
    .btn-exit {
      background: none;
      border: 1px solid var(--border-s);
      color: var(--txt-2);
      padding: .35rem .7rem;
      border-radius: 6px;
      font-size: .8rem;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-exit:hover { color: var(--bad); border-color: var(--bad); }

    .progress-bar {
      background: var(--border-s);
      height: 6px;
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 1.5rem;
    }
    .progress-bar-fill {
      background: var(--T);
      height: 100%;
      width: 0%;
      transition: width .3s;
    }

    .question-card {
      background: var(--bg-card);
      border: 1px solid var(--border-s);
      border-radius: 14px;
      padding: 1.5rem;
      margin-bottom: 1.25rem;
    }
    .question-num { color: var(--T); font-weight: 700; font-size: 1.1rem; margin-bottom: .5rem; }
    .question-text {
      font-size: 1.05rem;
      line-height: 1.55;
      color: var(--dark);
      margin-bottom: 1.1rem;
    }
    .options { list-style: none; padding: 0; margin: 0; display: grid; gap: .55rem; }
    .option-btn {
      display: flex;
      align-items: flex-start;
      gap: .8rem;
      padding: .85rem 1rem;
      background: var(--bg-card);
      border: 2px solid var(--border-s);
      border-radius: 10px;
      cursor: pointer;
      transition: all .15s;
      font: inherit;
      color: var(--txt);
      text-align: left;
      width: 100%;
      line-height: 1.45;
    }
    .option-btn:hover { border-color: var(--T); background: #F7FDFC; }
    .option-btn.selected { border-color: var(--T); background: #E6FBF8; }
    .option-btn.correct { border-color: var(--ok); background: #E6F8EF; }
    .option-btn.wrong { border-color: var(--bad); background: #FCE6EE; }
    .option-btn:disabled { cursor: default; }
    .option-letter { font-weight: 700; color: var(--P); flex-shrink: 0; min-width: 1.4rem; }
    .option-btn.correct .option-letter { color: var(--ok); }
    .option-btn.wrong .option-letter { color: var(--bad); }
    .option-text { flex: 1; }

    .feedback {
      margin-top: 1rem;
      padding: .8rem 1rem;
      border-radius: 8px;
      font-size: .9rem;
      display: none;
    }
    .feedback.show { display: block; }
    .feedback.ok { background: #E6F8EF; color: #0E7A48; border-left: 4px solid var(--ok); }
    .feedback.bad { background: #FCE6EE; color: #9B1239; border-left: 4px solid var(--bad); }
    .feedback-exp {
      margin-top: .6rem;
      padding-top: .6rem;
      border-top: 1px solid currentColor;
      opacity: .85;
      font-weight: 400;
      line-height: 1.5;
    }

    .quiz-nav { display: flex; justify-content: space-between; gap: .75rem; margin-top: 1rem; }
    .btn {
      background: var(--T);
      color: var(--dark);
      border: none;
      padding: .75rem 1.4rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      font-size: .95rem;
      transition: all .15s;
    }
    .btn:hover { background: var(--P); color: white; }
    .btn:disabled { background: #ddd; color: #999; cursor: not-allowed; }
    .btn-secondary { background: transparent; color: var(--txt-2); border: 1px solid var(--border-s); }
    .btn-secondary:hover { color: var(--dark); background: white; }

    .results-hero {
      background: var(--bg-card);
      border: 1px solid var(--border-s);
      border-radius: 14px;
      padding: 1.8rem 1.5rem;
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .results-score {
      font-family: 'Playfair Display', serif;
      font-weight: 900;
      font-size: 3.5rem;
      color: var(--P);
      line-height: 1;
      margin: .5rem 0;
    }
    .results-score .total { color: var(--txt-2); font-size: 2rem; }
    .results-pct { font-size: 1.1rem; color: var(--T); font-weight: 600; }
    .results-pct.bad { color: var(--bad); }
    .results-pct.ok { color: var(--ok); }

    .results-breakdown {
      background: var(--bg-card);
      border: 1px solid var(--border-s);
      border-radius: 14px;
      padding: 1.2rem 1.4rem;
      margin-bottom: 1.5rem;
    }
    .results-breakdown h3 { margin: 0 0 .8rem; font-size: 1rem; color: var(--P); }
    .breakdown-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: .5rem 0;
      border-bottom: 1px solid var(--border-s);
      font-size: .92rem;
    }
    .breakdown-row:last-child { border-bottom: none; }
    .breakdown-bar {
      flex: 1;
      margin: 0 1rem;
      background: var(--border-s);
      height: 6px;
      border-radius: 3px;
      overflow: hidden;
    }
    .breakdown-bar-fill { background: var(--T); height: 100%; }
    .breakdown-score { font-weight: 600; color: var(--dark); min-width: 3.5rem; text-align: right; }

    .results-errors {
      background: #FFF6FA;
      border: 1px solid #FFD0E5;
      border-radius: 14px;
      padding: 1.2rem 1.4rem;
      margin-bottom: 1.5rem;
    }
    .results-errors h3 { margin: 0 0 .8rem; font-size: 1rem; color: var(--M); }
    .error-item { padding: .6rem 0; border-bottom: 1px solid #FFD0E5; font-size: .9rem; }
    .error-item:last-child { border-bottom: none; }
    .error-num { color: var(--M); font-weight: 700; }
    .error-detail { color: var(--txt-2); font-size: .82rem; margin-top: .2rem; }
    .error-detail .ok-text { color: var(--ok); }
    .error-detail .bad-text { color: var(--bad); text-decoration: line-through; }

    .results-actions { display: grid; gap: .6rem; grid-template-columns: 1fr 1fr; }
    .btn-big { padding: 1rem; font-size: 1rem; border-radius: 10px; }

    @media (max-width: 540px) {
      main { padding: 1.25rem 1rem 3rem; }
      .question-card { padding: 1.1rem; }
      .results-actions { grid-template-columns: 1fr; }
      .results-score { font-size: 2.8rem; }
      .results-score .total { font-size: 1.6rem; }
    }
    .katex { white-space: nowrap; }

    /* Cronómetro del examen completo */
    .exam-timer {
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      color: var(--P);
      background: var(--bg);
      border: 1px solid var(--border-s);
      padding: .3rem .6rem;
      border-radius: 8px;
      font-size: .9rem;
      white-space: nowrap;
    }
    .exam-panel {
      border-left-color: var(--P);
      background: linear-gradient(180deg, #F7EEFF, #FFFFFF);
    }

    .footer-mini {
      text-align: center;
      padding: 2rem 0 1rem;
      font-size: .75rem;
      color: var(--txt-2);
      max-width: 600px;
      margin: 0 auto;
      line-height: 1.5;
    }
  </style>
</head>
<body>

<main id="app"></main>

<div class="footer-mini">
  Simulador de práctica para el examen único de ingreso a bachillerato (COMIPEMS / ECOEMS).<br>
  Preguntas representativas del nivel y temario — no son los reactivos oficiales literales.
</div>

<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

<script>
// ───────────────────────────────────────────
// BANCO DE PREGUNTAS
// Notación: $...$ para fórmulas KaTeX.
// ───────────────────────────────────────────
const QUESTIONS = {

  verbal: [
    { n:1, text:"Elige el sinónimo de <strong>efímero</strong>.",
      options:["Eterno","Pasajero","Sólido","Profundo"], correct:1,
      explanation:"Efímero significa que dura poco tiempo; su sinónimo es pasajero o fugaz." },
    { n:2, text:"Elige el antónimo de <strong>prolijo</strong>.",
      options:["Detallado","Cuidadoso","Descuidado","Extenso"], correct:2,
      explanation:"Prolijo significa muy cuidadoso y esmerado; su antónimo es descuidado." },
    { n:3, text:"Completa la analogía: MÉDICO es a HOSPITAL como MAESTRO es a…",
      options:["Escuela","Alumno","Libro","Examen"], correct:0,
      explanation:"Relación de profesional con su lugar de trabajo: el maestro trabaja en la escuela." },
    { n:4, text:"Completa la analogía: PEZ es a ESCAMA como AVE es a…",
      options:["Nido","Pluma","Vuelo","Pico"], correct:1,
      explanation:"Relación de animal con lo que recubre su cuerpo: al pez la escama, al ave la pluma." },
    { n:5, text:"Elige el sinónimo de <strong>vacilar</strong>.",
      options:["Decidir","Dudar","Afirmar","Correr"], correct:1,
      explanation:"Vacilar es titubear o dudar antes de actuar." },
    { n:6, text:"¿Qué significa <strong>hipótesis</strong>?",
      options:["Una conclusión ya comprobada","Una suposición que se intenta comprobar","Una ley científica","Un experimento"], correct:1,
      explanation:"Una hipótesis es una suposición provisional que se pone a prueba para comprobarla o rechazarla." },
    { n:7, text:"Elige el antónimo de <strong>magnánimo</strong>.",
      options:["Generoso","Mezquino","Grande","Noble"], correct:1,
      explanation:"Magnánimo es generoso y noble; su antónimo es mezquino o tacaño." },
    { n:8, text:"Completa: «No asistió a la reunión ____ estaba enfermo».",
      options:["aunque","porque","sino","pero"], correct:1,
      explanation:"Se necesita una conjunción causal: «porque» introduce el motivo de la ausencia." },
    { n:9, text:"Completa la analogía: AGUA es a SED como COMIDA es a…",
      options:["Hambre","Plato","Cocina","Sabor"], correct:0,
      explanation:"El agua sacia la sed; la comida sacia el hambre. Relación de necesidad y satisfacción." },
    { n:10, text:"Elige el sinónimo de <strong>íntegro</strong> (referido a una persona).",
      options:["Parcial","Honesto","Débil","Falso"], correct:1,
      explanation:"Una persona íntegra es honrada y recta; sinónimo de honesto." },
    { n:11, text:"Elige el sinónimo de <strong>abundante</strong>.",
      options:["Escaso","Copioso","Pequeño","Único"], correct:1,
      explanation:"Abundante es que hay mucho de algo; sinónimo de copioso." },
    { n:12, text:"Elige el antónimo de <strong>generoso</strong>.",
      options:["Dadivoso","Tacaño","Amable","Espléndido"], correct:1,
      explanation:"Generoso es quien comparte con desprendimiento; su antónimo es tacaño." },
    { n:13, text:"Completa la analogía: LIBRO es a LEER como MÚSICA es a…",
      options:["Escuchar","Escribir","Comprar","Guardar"], correct:0,
      explanation:"El libro se lee; la música se escucha. Relación de objeto con su acción." },
    { n:14, text:"Elige el sinónimo de <strong>valiente</strong>.",
      options:["Cobarde","Audaz","Tímido","Débil"], correct:1,
      explanation:"Valiente es quien enfrenta el peligro; sinónimo de audaz o intrépido." },
    { n:15, text:"Elige el antónimo de <strong>claro</strong> (en cuanto a luz).",
      options:["Oscuro","Limpio","Blanco","Nítido"], correct:0,
      explanation:"Lo opuesto a claro es oscuro." },
    { n:16, text:"Elige el sinónimo de <strong>rápido</strong>.",
      options:["Veloz","Lento","Quieto","Pesado"], correct:0,
      explanation:"Rápido y veloz significan lo mismo: que va de prisa." },
    { n:17, text:"Completa la analogía: GUANTE es a MANO como ZAPATO es a…",
      options:["Pie","Calcetín","Suelo","Cordón"], correct:0,
      explanation:"El guante cubre la mano; el zapato cubre el pie." },
    { n:18, text:"Elige el sinónimo de <strong>comenzar</strong>.",
      options:["Terminar","Iniciar","Detener","Cerrar"], correct:1,
      explanation:"Comenzar e iniciar significan empezar algo." },
    { n:19, text:"Elige el antónimo de <strong>humilde</strong>.",
      options:["Sencillo","Soberbio","Modesto","Pobre"], correct:1,
      explanation:"Humilde es modesto y sencillo; su antónimo es soberbio o arrogante." },
    { n:20, text:"Elige el sinónimo de <strong>obstáculo</strong>.",
      options:["Ayuda","Impedimento","Camino","Meta"], correct:1,
      explanation:"Un obstáculo es algo que estorba; sinónimo de impedimento o barrera." },
    { n:21, text:"Completa: «Estudió mucho, ____ aprobó el examen».",
      options:["por eso","aunque","pero","ni"], correct:0,
      explanation:"Se expresa una consecuencia: «por eso» indica el resultado de estudiar." },
    { n:22, text:"Completa la analogía: FRÍO es a CALIENTE como SECO es a…",
      options:["Húmedo","Árido","Tibio","Duro"], correct:0,
      explanation:"Frío y caliente son opuestos; seco y húmedo también lo son." },
    { n:23, text:"Elige el sinónimo de <strong>antiguo</strong>.",
      options:["Nuevo","Viejo","Moderno","Actual"], correct:1,
      explanation:"Antiguo es lo que tiene mucho tiempo; sinónimo de viejo." },
    { n:24, text:"Elige el antónimo de <strong>aumentar</strong>.",
      options:["Crecer","Disminuir","Subir","Sumar"], correct:1,
      explanation:"Aumentar es hacer más grande; su antónimo es disminuir." },
    { n:25, text:"Elige el sinónimo de <strong>alegría</strong>.",
      options:["Tristeza","Júbilo","Enojo","Miedo"], correct:1,
      explanation:"Alegría y júbilo expresan un sentimiento de felicidad." },
    { n:26, text:"¿Qué significa el refrán «A caballo regalado no se le ve el colmillo»?",
      options:["No hay que criticar lo que se recibe gratis","Los caballos son muy caros","Siempre revisa los dientes","Nunca aceptes regalos"], correct:0,
      explanation:"Significa que no debemos poner defectos a algo que nos regalan." },
    { n:27, text:"Completa la analogía: ABEJA es a PANAL como PÁJARO es a…",
      options:["Nido","Cielo","Árbol","Huevo"], correct:0,
      explanation:"La abeja vive en el panal; el pájaro, en el nido. Relación de animal con su hogar." },
    { n:28, text:"Elige el sinónimo de <strong>necesario</strong>.",
      options:["Opcional","Imprescindible","Inútil","Adicional"], correct:1,
      explanation:"Necesario es lo que hace falta; sinónimo de imprescindible." },
    { n:29, text:"Elige el antónimo de <strong>permitir</strong>.",
      options:["Dejar","Prohibir","Aceptar","Autorizar"], correct:1,
      explanation:"Permitir es dejar hacer algo; su antónimo es prohibir." },
    { n:30, text:"Elige el sinónimo de <strong>famoso</strong>.",
      options:["Desconocido","Célebre","Común","Anónimo"], correct:1,
      explanation:"Famoso y célebre describen a alguien muy conocido." },
    { n:31, text:"Completa: «No solo llegó tarde, ____ tampoco avisó».",
      options:["sino que","porque","aunque","pero"], correct:0,
      explanation:"«No solo… sino que…» es la estructura correcta para añadir información." },
    { n:32, text:"¿Qué significa <strong>perspicaz</strong>?",
      options:["Torpe","Agudo o astuto","Lento","Distraído"], correct:1,
      explanation:"Perspicaz es quien comprende las cosas con rapidez y agudeza." },
    { n:33, text:"Completa la analogía: MÉDICO es a ENFERMEDAD como BOMBERO es a…",
      options:["Incendio","Agua","Casa","Escalera"], correct:0,
      explanation:"El médico combate la enfermedad; el bombero combate el incendio." },
    { n:34, text:"Elige el sinónimo de <strong>tranquilo</strong>.",
      options:["Nervioso","Sereno","Agitado","Inquieto"], correct:1,
      explanation:"Tranquilo y sereno expresan calma." },
    { n:35, text:"Elige el antónimo de <strong>verdad</strong>.",
      options:["Certeza","Mentira","Realidad","Hecho"], correct:1,
      explanation:"Lo opuesto a la verdad es la mentira." },
    { n:36, text:"Elige el sinónimo de <strong>ayudar</strong>.",

// Formato de tiempo h:mm:ss para el cronómetro
function fmtTime(s) {
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  return `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}

function loadStore() {

  } catch { return { errors: {}, history: [] }; }
}
function saveStore(store) { localStorage.setItem(STORAGE_KEY, JSON.stringify(store)); }

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function pick(arr, n) { return shuffle(arr).slice(0, n); }
// Baraja las opciones de una pregunta para que la correcta no quede siempre
// en la misma posición (el banco tiende a poner la correcta en la A).
function shuffleOptions(q) {
  const order = shuffle(q.options.map((_, i) => i));
  return { ...q, options: order.map(i => q.options[i]), correct: order.indexOf(q.correct) };
}
function qKey(subj, n) { return `${subj}:${n}`; }
function findQuestion(key) {
  const [subj, n] = key.split(':');
  return { subject: subj, ...QUESTIONS[subj].find(q => q.n === parseInt(n)) };
}

function renderMath(el) {
  if (window.renderMathInElement) {
    renderMathInElement(el, {
      delimiters: [
        { left: '$$', right: '$$', display: true },
        { left: '$', right: '$', display: false },
      ],
      throwOnError: false,
    });
  }
}

function renderLanding() {
  const store = loadStore();
  const errorCount = Object.keys(store.errors).length;
  const recent = store.history.slice(-5).reverse();
  const activeTab = state.activeTab || 'razonamiento';

  let html = `
    <h1 class="page-h1">Simulador COMIPEMS</h1>
    <p class="page-sub">Examen de ingreso a bachillerato · practica por bloques y repasa lo que falles</p>
    <div class="tabs" role="tablist">
  `;

  for (const [id, b] of Object.entries(BLOCKS)) {
    const isActive = id === activeTab;
    html += `<button class="tab-btn ${isActive ? 'active' : ''}" style="--tab-accent:${b.accent}" onclick="switchTab('${id}')">${b.title.replace(/^Bloque \d+ · /, '')}</button>`;
  }
  html += `<button class="tab-btn ${activeTab==='examen'?'active':''}" style="--tab-accent:var(--P)" onclick="switchTab('examen')">Examen completo</button>`;
  html += `<button class="tab-btn ${activeTab==='errores'?'active':''}" style="--tab-accent:var(--M)" onclick="switchTab('errores')">Errores${errorCount?` (${errorCount})`:''}</button>`;
  html += `</div>`;

  for (const [id, b] of Object.entries(BLOCKS)) {
    const isActive = id === activeTab;
    const total = b.composition.reduce((s, c) => s + c.count, 0);
    html += `
      <div class="tab-panel ${isActive?'active':''}" id="panel-${id}">
        <div class="panel-block" style="--accent:${b.accent}">
          <p class="panel-subtitle">${b.subtitle}</p>
          <h2>${b.title}</h2>
          <p class="panel-count">${total} preguntas · selección aleatoria del banco</p>
          <ul class="composition">
            ${b.composition.map(c => `<li><strong>${c.count}</strong> ${c.label}</li>`).join('')}
          </ul>
          <button class="btn-start" onclick="startQuiz('${id}')">Empezar ronda →</button>
        </div>
      </div>
    `;
  }

  // Panel del examen completo
  html += `<div class="tab-panel ${activeTab==='examen'?'active':''}" id="panel-examen">
    <div class="panel-block exam-panel" style="--accent:var(--P)">
      <p class="panel-subtitle">Simulacro del examen real</p>
      <h2>Examen completo</h2>
      <p class="panel-count">128 preguntas · 3 horas · cronómetro en cuenta regresiva</p>
      <ul class="composition">
        <li><strong>16</strong> Hab. verbal</li>
        <li><strong>16</strong> Hab. matemática</li>
        <li><strong>12</strong> Español</li>
        <li><strong>12</strong> Matemáticas</li>
        <li><strong>12</strong> Física</li>
        <li><strong>12</strong> Química</li>
        <li><strong>12</strong> Biología</li>
        <li><strong>12</strong> Historia</li>
        <li><strong>12</strong> Geografía</li>
        <li><strong>12</strong> Cívica y Ética</li>
      </ul>
      <button class="btn-start" onclick="if(confirm('Vas a iniciar el examen completo: 128 preguntas y 3 horas de cronómetro. ¿Comenzar?')) startExam()">Iniciar examen completo →</button>
    </div>
  </div>`;

  html += `<div class="tab-panel ${activeTab==='errores'?'active':''}" id="panel-errores">
    <div class="errors-card">
      <div class="errors-card-text">
        <strong>Repasar mis errores</strong>
        <p>${errorCount === 0 ? 'Aún no tienes errores guardados. Resuelve un bloque primero.' :
            `${errorCount} pregunta${errorCount === 1 ? '' : 's'} guardada${errorCount === 1 ? '' : 's'} de rondas anteriores.`}</p>
      </div>
      <button class="btn-errors" ${errorCount === 0 ? 'disabled' : ''} onclick="startErrorsReview()">Repasar →</button>
    </div>
    ${errorCount > 0 ? `<div style="text-align:center; margin-top: 1rem;">
      <button class="btn-secondary btn" onclick="clearErrors()">Limpiar errores guardados</button>
    </div>` : ''}
  </div>`;

  if (recent.length) {
    html += `<div class="history-card"><h3>Rondas recientes</h3><ul class="history-list">`;
    recent.forEach(h => {
      const block = titleFor(h.blockId);
      const pct = Math.round(100 * h.score / h.total);
      html += `<li><span>${block}</span><span><strong>${h.score}/${h.total}</strong> · ${pct}%</span></li>`;
    });
    html += `</ul></div>`;
  }

  document.getElementById('app').innerHTML = html;
}

function switchTab(id) { state.activeTab = id; renderLanding(); }

function clearErrors() {
  if (!confirm('¿Borrar todos los errores guardados?')) return;
  const store = loadStore();
  store.errors = {};
  saveStore(store);
  renderLanding();
}

// ───────────────────────────────────────────
// QUIZ
// ───────────────────────────────────────────
function startQuiz(blockId) {
  stopTimer();
  const block = BLOCKS[blockId];
  const selected = [];
  block.composition.forEach(c => {
    const pool = QUESTIONS[c.subject];
    pick(pool, c.count).forEach(q => {
      selected.push({ subject: c.subject, label: c.label, ...q });
    });
  });
  state.mode = 'quiz';
  state.blockId = blockId;
  state.questions = shuffle(selected).map(shuffleOptions);
  state.answers = {};
  state.index = 0;
  renderQuiz();
}

// ─── EXAMEN COMPLETO (128 reactivos, cronometrado) ───
function startExam() {
  stopTimer();
  const selected = [];
  EXAM_COMPOSITION.forEach(c => {
    pick(QUESTIONS[c.subject], c.count).forEach(q => {
      selected.push({ subject: c.subject, label: SUBJECT_LABELS[c.subject], ...q });
    });
  });
  state.mode = 'quiz';
  state.blockId = 'examen';
  state.questions = shuffle(selected).map(shuffleOptions);
  state.answers = {};
  state.index = 0;
  state.examEndsAt = Date.now() + EXAM_SECONDS * 1000;
  startTimer();
  renderQuiz();
}

function startTimer() {
  stopTimer();
  examTimer = setInterval(() => {
    const remain = Math.max(0, Math.floor((state.examEndsAt - Date.now()) / 1000));
    const el = document.getElementById('exam-timer');
    if (el) {
      el.textContent = fmtTime(remain);
      if (remain <= 600) el.style.color = 'var(--bad)'; // últimos 10 min en rojo
    }
    if (remain <= 0) { stopTimer(); finishQuiz(); }
  }, 1000);
}

function stopTimer() {
  if (examTimer) { clearInterval(examTimer); examTimer = null; }
}

function startErrorsReview() {
  stopTimer();
  const store = loadStore();
  const keys = Object.keys(store.errors);
  if (keys.length === 0) return;
  const selected = keys.map(k => {
    const q = findQuestion(k);
    return { ...q, label: SUBJECT_LABELS[q.subject] || q.subject };
  });
  state.mode = 'quiz';
  state.blockId = 'errores';
  state.questions = shuffle(selected).map(shuffleOptions);
  state.answers = {};
  state.index = 0;
  renderQuiz();
}

function renderQuiz() {
  const total = state.questions.length;
  const q = state.questions[state.index];
  const key = qKey(q.subject, q.n);
  const userAns = state.answers[key];
  const answered = userAns !== undefined;
  const headerTitle = titleFor(state.blockId);
  const progressPct = (state.index / total) * 100;
  const isExam = state.blockId === 'examen';
  const remain = isExam ? Math.max(0, Math.floor((state.examEndsAt - Date.now()) / 1000)) : 0;

  let html = `
    <div class="quiz-header">
      <div class="quiz-progress"><strong>${headerTitle}</strong> · Pregunta ${state.index + 1} de ${total}</div>
      <div style="display:flex; align-items:center; gap:.6rem;">
        ${isExam ? `<span class="exam-timer" id="exam-timer" title="Tiempo restante">⏱ ${fmtTime(remain)}</span>` : ''}
        <button class="btn-exit" onclick="confirmExit()">Salir</button>
      </div>
    </div>
    <div class="progress-bar"><div class="progress-bar-fill" style="width: ${progressPct}%"></div></div>

    <div class="question-card">
      <div class="question-num">
        <span class="subject-tag" style="background:${blockColorFor(q.subject)}">${q.label || SUBJECT_LABELS[q.subject]}</span>
      </div>
      <div class="question-text">${q.text}</div>

      <div class="options" id="options-container">
        ${q.options.map((opt, i) => {
          const letter = ['A','B','C','D'][i];
          let cls = 'option-btn';
          if (answered) {
            if (i === q.correct) cls += ' correct';
            else if (i === userAns) cls += ' wrong';
          } else if (userAns === i) {
            cls += ' selected';
          }
          return `<button class="${cls}" ${answered ? 'disabled' : ''} onclick="selectOption(${i})">
            <span class="option-letter">${letter})</span>
            <span class="option-text">${opt}</span>
          </button>`;
        }).join('')}
      </div>

      ${answered ? renderFeedback(q, userAns) : ''}
    </div>

    <div class="quiz-nav">
      <button class="btn btn-secondary" ${state.index === 0 ? 'disabled' : ''} onclick="navQuiz(-1)">← Anterior</button>
      ${state.index === total - 1
        ? `<button class="btn" ${!answered ? 'disabled' : ''} onclick="finishQuiz()">Ver resultados</button>`
        : `<button class="btn" ${!answered ? 'disabled' : ''} onclick="navQuiz(1)">Siguiente →</button>`}
    </div>
  `;

  const app = document.getElementById('app');
  app.innerHTML = html;
  renderMath(app);
}

function blockColorFor(subj) {
  for (const b of Object.values(BLOCKS)) {
    if (b.composition.some(c => c.subject === subj)) return b.accent;
  }
  return '#4A0080';
}

function renderFeedback(q, userAns) {
  const correctLetter = ['A','B','C','D'][q.correct];
  const exp = q.explanation ? `<div class="feedback-exp">${q.explanation}</div>` : '';
  if (userAns === q.correct) {
    return `<div class="feedback ok show">✓ Correcto.${exp}</div>`;
  }
  return `<div class="feedback bad show">✗ La respuesta correcta es <strong>${correctLetter})</strong>.${exp}</div>`;
}

function selectOption(i) {
  const q = state.questions[state.index];
  const key = qKey(q.subject, q.n);
  if (state.answers[key] !== undefined) return;
  state.answers[key] = i;

  const store = loadStore();
  if (i !== q.correct) {
    store.errors[key] = (store.errors[key] || 0) + 1;
  } else if (store.errors[key]) {
    delete store.errors[key];
  }
  saveStore(store);
  renderQuiz();
}

function navQuiz(delta) { state.index += delta; renderQuiz(); }

function confirmExit() {
  const msg = state.blockId === 'examen'
    ? '¿Salir del examen? Se perderá tu avance y el tiempo.'
    : '¿Salir de la ronda? Tus respuestas se perderán.';
  if (confirm(msg)) {
    stopTimer();
    state.mode = 'landing';
    renderLanding();
  }
}

// ───────────────────────────────────────────
// RESULTADOS
// ───────────────────────────────────────────
function finishQuiz() {
  stopTimer();
  state.mode = 'results';
  let score = 0;
  const perSubject = {};
  const errors = [];

  state.questions.forEach(q => {
    const key = qKey(q.subject, q.n);
    const ans = state.answers[key];
    const subj = q.subject;
    perSubject[subj] = perSubject[subj] || { ok: 0, total: 0, label: q.label || SUBJECT_LABELS[subj] };
    perSubject[subj].total++;
    if (ans === q.correct) { score++; perSubject[subj].ok++; }
    else { errors.push({ q, ans }); }
  });

  const store = loadStore();
  store.history.push({ date: new Date().toISOString(), blockId: state.blockId, score, total: state.questions.length });
  if (store.history.length > 20) store.history = store.history.slice(-20);
  saveStore(store);

  renderResults(score, perSubject, errors);
}

function renderResults(score, perSubject, errors) {
  const total = state.questions.length;
  const pct = Math.round(100 * score / total);
  const pctClass = pct >= 70 ? 'ok' : pct >= 50 ? '' : 'bad';
  const blockTitle = titleFor(state.blockId);

  let html = `
    <div class="results-hero">
      <p class="page-sub" style="margin:0">${blockTitle}</p>
      <div class="results-score">${score}<span class="total">/${total}</span></div>
      <div class="results-pct ${pctClass}">${pct}% de aciertos</div>
    </div>
  `;

  html += `<div class="results-breakdown"><h3>Desglose por materia</h3>`;
  for (const data of Object.values(perSubject)) {
    const sPct = Math.round(100 * data.ok / data.total);
    html += `<div class="breakdown-row">
      <span>${data.label}</span>
      <div class="breakdown-bar"><div class="breakdown-bar-fill" style="width:${sPct}%; background:${sPct>=70?'#1FBA77':sPct>=50?'#00DEC8':'#E03B6A'}"></div></div>
      <span class="breakdown-score">${data.ok}/${data.total}</span>
    </div>`;
  }
  html += `</div>`;

  if (errors.length) {
    html += `<div class="results-errors"><h3>Lo que fallaste (${errors.length})</h3>`;
    errors.forEach(({ q, ans }) => {
      const letterAns = ans === undefined ? '—' : ['A','B','C','D'][ans];
      const letterOk = ['A','B','C','D'][q.correct];
      html += `<div class="error-item">
        <div><span class="error-num">${q.label || SUBJECT_LABELS[q.subject]}</span> — ${stripHtml(q.text).slice(0,120)}${stripHtml(q.text).length>120?'...':''}</div>
        <div class="error-detail">Marcaste: <span class="bad-text">${letterAns}</span> · Correcta: <span class="ok-text"><strong>${letterOk}</strong></span></div>
      </div>`;
    });
    html += `</div>`;
  } else {
    html += `<div class="results-errors" style="background:#E6F8EF; border-color:#1FBA77">
      <h3 style="color:#0E7A48">🎉 ¡Sin errores! Perfecto.</h3>
    </div>`;
  }

  html += `<div class="results-actions">`;
  if (errors.length) {
    html += `<button class="btn btn-big" onclick="reviewWrongOnly()">Repasar sólo lo fallado</button>`;
  }
  if (state.blockId === 'examen') {
    html += `<button class="btn btn-big" onclick="startExam()">Otro examen completo</button>`;
  } else if (state.blockId !== 'errores') {
    html += `<button class="btn btn-big" onclick="startQuiz('${state.blockId}')">Nueva ronda</button>`;
  } else {
    html += `<button class="btn btn-big" onclick="startErrorsReview()">Otra ronda de errores</button>`;
  }
  html += `<button class="btn btn-big btn-secondary" style="grid-column: 1/-1" onclick="goLanding()">← Volver al inicio</button>`;
  html += `</div>`;

  const app = document.getElementById('app');
  app.innerHTML = html;
  renderMath(app);
}

function stripHtml(s) {
  const tmp = document.createElement('div');
  tmp.innerHTML = s;
  return tmp.textContent || tmp.innerText || '';
}

function reviewWrongOnly() {
  stopTimer();
  const wrong = state.questions.filter(q => {
    const ans = state.answers[qKey(q.subject, q.n)];
    return ans !== q.correct;
  });
  state.mode = 'quiz';
  state.blockId = 'errores';
  state.questions = shuffle(wrong).map(shuffleOptions);
  state.answers = {};
  state.index = 0;
  renderQuiz();
}

function goLanding() {
  stopTimer();
  state.mode = 'landing';
  state.blockId = null;
  state.questions = [];
  state.answers = {};
  state.index = 0;
  renderLanding();
}

renderLanding();
</script>
</body>
</html>
